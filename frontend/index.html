<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel IoT - Poziom Hałasu</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 20px;
            width: 80%;
            max-width: 600px;
        }
        .db-value {
            font-size: 3em;
            font-weight: bold;
            color: #007bff;
            margin: 10px 0;
        }
        canvas {
            width: 100% !important;
            max-height: 300px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Aktualny Poziom Hałasu</h2>
        <div class="db-value" id="currentDb">-- dB</div>
        <p>Urządzenie: <span id="deviceId">Oczekiwanie...</span></p>
        <p>Status: <span id="status">Oczekiwanie...</span></p>
    </div>

    <div class="card">
        <canvas id="noiseChart"></canvas>
    </div>

    <script>
        // Konfiguracja adresu API (zmień jeśli FastAPI działa na innym porcie/adresie)
        const API_URL = "http://127.0.0.1:8000/api/noise/current";

        // Inicjalizacja pustego wykresu
        const ctx = document.getElementById('noiseChart').getContext('2d');
        const noiseChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Oś czasu
                datasets: [{
                    label: 'Natężenie dźwięku (dB)',
                    data: [], // Wartości
                    borderColor: '#007bff',
                    backgroundColor: 'rgba(0, 123, 255, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3 // Lekkie zaokrąglenie linii
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100 // Maksymalna wartość na wykresie
                    }
                },
                animation: {
                    duration: 0 // Wyłączenie animacji przy odświeżaniu dla płynności
                }
            }
        });

        // Funkcja pobierająca dane z backendu
        async function fetchNoiseData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Błąd sieci");
                
                const data = await response.json();
                
                // 1. Aktualizacja tekstu w kartach
                document.getElementById('currentDb').innerText = data.db.toFixed(1) + " dB";
                document.getElementById('deviceId').innerText = data.device;
                document.getElementById('status').innerText = data.status;

                // 2. Aktualizacja wykresu
                const now = new Date();
                const timeLabel = now.getHours() + ':' + 
                                 now.getMinutes().toString().padStart(2, '0') + ':' + 
                                 now.getSeconds().toString().padStart(2, '0');

                // Dodaj nowe dane na koniec
                noiseChart.data.labels.push(timeLabel);
                noiseChart.data.datasets[0].data.push(data.db);

                // Usuń najstarsze dane, jeśli jest ich za dużo (np. więcej niż 20 punktów)
                if (noiseChart.data.labels.length > 20) {
                    noiseChart.data.labels.shift();
                    noiseChart.data.datasets[0].data.shift();
                }

                noiseChart.update();

            } catch (error) {
                console.error("Błąd podczas pobierania danych:", error);
                document.getElementById('status').innerText = "Błąd połączenia z API";
            }
        }

        // Uruchom odpytywanie natychmiast, a potem co 1 sekundę (1000 ms)
        fetchNoiseData();
        setInterval(fetchNoiseData, 1000);
    </script>

</body>
</html>
